<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pheonix Package Index</title>

    <link rel="canonical" href="https://pheonix-studios-git.github.io/PPI/">
    <meta name="description" content="Pheonix Package Index (PPI) is the official registry for NFX packages, providing searchable libraries, modules, and developer tools for the Pheonix ecosystem.">
    <meta name="keywords" content="Pheonix Package Index, PPI, NFX, Nova Pheonix, package manager, packages, modules, libraries, developer tools">
    <meta property="og:title" content="Pheonix Package Index">
    <meta property="og:description" content="Search, browse, and explore packages for the Nova Pheonix Package Manager (NFX).">
    <meta property="og:url" content="https://pheonix-studios-git.github.io/PPI/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://pheonix-studios-git.github.io/PPI/assets/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Pheonix Package Index">
    <meta name="twitter:description" content="Explore packages for the NFX (Nova Pheonix) Package Manager.">
    <meta name="google-site-verification" content="X5i3PtvJmAVWl-fg1SnZpeer0OZNud3oHsA5SAehJH0" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self';
        style-src 'self';
        img-src 'self' data:;
        font-src 'self';
        connect-src 'self';
        manifest-src 'self';
        base-uri 'none';
        form-action 'none';
        frame-ancestors 'none';
        object-src 'none';
        upgrade-insecure-requests;
        block-all-mixed-content;
    ">
    <script src="./src/components/DOMPurify.js"></script>
    <script type="application/ld+json" src="./schema.json"></script>

    <link rel="icon" type="image/png" href="./assets/logo.png">
    
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="./src/css/card.css">
    <link rel="stylesheet" href="./src/css/awsomefont.min.css">
</head>

<body>
    <header>
        <h1>Pheonix Package Index</h1>
        <button id="theme-btn"></button>
        <input type="text" id="search-bar" placeholder="Search Packages...">
    </header>
    <main>
        <section id="featured-packages">
            <noscript>Your browser does not support Javascript, Packages cannot be displayed. However NFX will still work!</noscript>
        </section>
        <section id="package-list">
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Pheonix Studios</p>
    </footer>

    <script type="module" src="./src/app.js"></script>
    <script type="module" src="./src/theme.js"></script>
</body>

</html>
